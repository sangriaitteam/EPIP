server {
    # IPv4 — listens on all interfaces (Wi-Fi, Ethernet)
    listen 80;
    # IPv6 — listens on all IPv6 interfaces
    listen [::]:80;

    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ───────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript
                    image/svg+xml font/woff font/woff2;

    # ── Static assets — cache aggressively (Vite hashed filenames) ─────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires            1y;
        add_header         Cache-Control "public, immutable";
        try_files          $uri =404;
    }

    # ── index.html — no cache (new deploys picked up immediately) ───────────
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── API reverse proxy — /api/* → backend ──────────────────────────────
    # BACKEND_URL is set at runtime; defaults to http://backend:5000 (Docker)
    # For local dev without Docker: http://localhost:5000
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        client_max_body_size 15M;
        proxy_read_timeout   120s;
        proxy_connect_timeout 10s;
    }

    # ── Uploaded files proxy (avatars, documents, screenshots) ────────────
    location /uploads/ {
        proxy_pass         http://backend:5000;
        proxy_set_header   Host      $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # ── React Router SPA fallback — ALL routes → index.html ────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
