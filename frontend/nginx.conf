server {
    listen 80;
    server_name _;

    # Serve React app files
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Cache static assets aggressively (hashed filenames from Vite build)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html — no cache (so new deploys are picked up immediately)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # API reverse proxy — forward /api/* to backend container
    location /api/ {
        proxy_pass         https://epip-production-1b98.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header   Host              epip-production-1b98.up.railway.app;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        # Upload size limit (match backend 10MB)
        client_max_body_size 15M;
        proxy_read_timeout   120s;
    }

    # Uploaded files reverse proxy (avatars, documents, etc.)
    location /uploads/ {
        proxy_pass       https://epip-production-1b98.up.railway.app;
        proxy_set_header Host epip-production-1b98.up.railway.app;
    }

    # React Router — serve index.html for all non-file routes (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
