version: '3.8'

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: epip_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: epip_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-epip2026}
    ports:
      - '5432:5432'
    volumes:
      - epip_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: epip_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: epip_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-epip2026}
      JWT_SECRET: ${JWT_SECRET:-epip_super_secret_jwt_key_change_in_production_2026}
      JWT_EXPIRES_IN: 7d
      # Frontend URL — used for CORS
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      BACKEND_URL: ${BACKEND_URL:-http://localhost/api}
      # SMTP — email notifications
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      # Storage
      STORAGE_PROVIDER: local
      UPLOAD_DIR: uploads
      # SuperAdmin authorized emails
      SUPERADMIN_EMAILS: ${SUPERADMIN_EMAILS}
      # Screenshot interval
      SCREENSHOT_INTERVAL_MINUTES: ${SCREENSHOT_INTERVAL_MINUTES:-10}
    ports:
      - '5000:5000'
    volumes:
      - epip_uploads:/app/uploads
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5000/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Frontend (React + nginx) ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # API URL used at Vite build time
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api}
    container_name: epip_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '80:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  epip_pgdata:
  epip_uploads:
