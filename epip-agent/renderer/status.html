<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>EPIP Agent Status</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1e293b;
      color: #f1f5f9;
      padding: 16px;
      user-select: none;
      -webkit-app-region: drag;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
    }
    .header-icon { font-size: 18px; }
    .header-title { font-size: 14px; font-weight: 700; }
    .header-sub   { font-size: 10px; color: #94a3b8; }

    .status-badge {
      margin-left: auto;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 600;
    }
    .badge-active  { background: #14532d; color: #4ade80; }
    .badge-paused  { background: #451a03; color: #fb923c; }
    .badge-stopped { background: #1e1b4b; color: #a5b4fc; }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid #1e293b;
    }
    .row-label { font-size: 11px; color: #94a3b8; }
    .row-value { font-size: 12px; font-weight: 600; color: #e2e8f0; }

    .user-row {
      background: #0f172a;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .user-avatar {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700;
    }
    .user-name  { font-size: 13px; font-weight: 600; }
    .user-role  { font-size: 10px; color: #94a3b8; text-transform: capitalize; }

    .actions {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      -webkit-app-region: no-drag;
    }
    .btn {
      flex: 1;
      padding: 7px 10px;
      border: 1px solid #334155;
      border-radius: 7px;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .btn:hover { background: #1e293b; border-color: #6366f1; }
    .btn-pause  { border-color: #fb923c; color: #fb923c; }
    .btn-resume { border-color: #4ade80; color: #4ade80; }
    .btn-logout { border-color: #f87171; color: #f87171; }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">📸</span>
    <div>
      <div class="header-title">EPIP Agent</div>
      <div class="header-sub">Screenshot Tracker</div>
    </div>
    <span class="status-badge" id="statusBadge">—</span>
  </div>

  <div class="user-row">
    <div class="user-avatar" id="userInitial">?</div>
    <div>
      <div class="user-name" id="userName">Loading…</div>
      <div class="user-role" id="userRole">—</div>
    </div>
  </div>

  <div class="row">
    <span class="row-label">🏢 Check-in</span>
    <span class="row-value" id="checkinStatus">—</span>
  </div>
  <div class="row">
    <span class="row-label">📅 Last capture</span>
    <span class="row-value" id="lastCapture">—</span>
  </div>
  <div class="row">
    <span class="row-label">📊 Total today</span>
    <span class="row-value" id="captureCount">—</span>
  </div>
  <div class="row">
    <span class="row-label">⏱ Interval</span>
    <span class="row-value" id="interval">—</span>
  </div>

  <div class="actions">
    <button class="btn btn-pause"  id="pauseBtn"  onclick="togglePause()">⏸ Pause</button>
    <button class="btn"            id="captureBtn" onclick="captureNow()">📸 Capture Now</button>
    <button class="btn btn-logout" onclick="doLogout()">Sign Out</button>
  </div>

  <script src="status.js"></script>
</body>
</html>
